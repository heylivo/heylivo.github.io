name: Daily Instagram post

# Renders today's card from automation/content_calendar.csv (German) or
# content_calendar_en.csv (English, every other day) and posts it to the heylivo Instagram
# account (same idea as the Smart Menu Solutions daily post). Does nothing until
# the secrets INSTAGRAM_USER_ID and INSTAGRAM_ACCESS_TOKEN are set.

on:
  schedule:
    # 15:00 UTC = 17:00/16:00 in Germany, 18:00/17:00 in Greece
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day number from the calendar instead of today's (optional)"
        required: false
      lang:
        description: "Language for that day: de or en"
        required: false
        default: "de"
      format:
        description: "reel or image (empty = DEFAULT_FORMAT below)"
        required: false
      post:
        description: "Post to Instagram? (no = only make the file)"
        required: false
        default: "yes"

# reel = 8-second video (reaches people who don't follow yet), image = still card
env:
  DEFAULT_FORMAT: image

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -n "$USER_ID" ] && [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Instagram secrets not set yet - nothing to post."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: automation
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Determine day
        working-directory: automation
        id: day
        env:
          DAY_INPUT: ${{ inputs.day }}
          LANG_INPUT: ${{ inputs.lang }}
          FORMAT_INPUT: ${{ inputs.format }}
        run: |
          if [[ "$DAY_INPUT" =~ ^[0-9]+$ ]]; then
            N="$DAY_INPUT"; L="de"; [ "$LANG_INPUT" = "en" ] && L="en"
          else
            read -r N L <<< "$(python get_day_number.py)"
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "lang=$L" >> "$GITHUB_OUTPUT"
          F="$DEFAULT_FORMAT"; [ "$FORMAT_INPUT" = "reel" ] && F=reel; [ "$FORMAT_INPUT" = "image" ] && F=image
          EXT=jpg; [ "$F" = "reel" ] && EXT=mp4
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "file=day-$N-$L-$(date -u +%F).$EXT" >> "$GITHUB_OUTPUT"

      - name: Make the post (card or Reel)
        working-directory: automation
        env:
          N: ${{ steps.day.outputs.n }}
          L: ${{ steps.day.outputs.lang }}
          FILE: ${{ steps.day.outputs.file }}
        run: |
          if [ "${{ steps.day.outputs.format }}" = "reel" ]; then
            python render_reel.py "$N" "output/$FILE" "$L"
          else
            python render_card.py "$N" "output/${FILE%.jpg}.png" "$L"
            python to_jpeg.py "output/${FILE%.jpg}.png" "output/$FILE"
          fi
          ls -la "output/$FILE"

      - name: Commit and push the file (Instagram needs a public URL)
        working-directory: automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/${{ steps.day.outputs.file }}"
          # only the 7 newest videos stay on the website
          python -c "import pathlib, subprocess; old = sorted(pathlib.Path('output').glob('*.mp4'), key=lambda p: p.stem[-10:], reverse=True)[7:]; [subprocess.run(['git', 'rm', '-q', str(p)], check=True) for p in old]"
          git commit -m "chore: Instagram ${{ steps.day.outputs.format }} for day ${{ steps.day.outputs.n }} (${{ steps.day.outputs.lang }})"
          git pull --rebase
          git push

      - name: Post to Instagram
        if: inputs.post != 'no'
        working-directory: automation
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          FILE="${{ steps.day.outputs.file }}"
          if [ "${{ steps.day.outputs.format }}" = "reel" ]; then
            # Videos via the website (GitHub serves them as video/mp4 there, raw.githubusercontent does not)
            URL="https://heylivo.com/automation/output/$FILE"
            for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && break; sleep 6; done
          else
            URL="https://raw.githubusercontent.com/${{ github.repository }}/main/automation/output/$FILE"
            for i in $(seq 1 20); do curl -sfI "$URL" > /dev/null && break; sleep 3; done
          fi
          python post_instagram.py "$URL" "${{ steps.day.outputs.n }}" "${{ steps.day.outputs.lang }}"
