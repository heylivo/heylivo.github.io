<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<!-- Vorlage für die täglichen Reels (1080 x 1920, 15 Sekunden, zwei Szenen). render_reel.py ersetzt
     die Platzhalter wie bei card.html und nimmt das Video Bild für Bild auf: window.setTime(t)
     stellt alle Animationen auf den Zeitpunkt t (Sekunden).
     Szene 1 (0-7 s): Kategorie, Frage, Untertitel. Szene 2 (7-15 s): "Hey Livo, ..." sagen,
     die Erinnerung kommt aufs Handy, zum Schluss heylivo.com. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans:wght@500;700;800&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif; color: #fff; background: #3062f9; }
  .reel { position: relative; box-sizing: border-box; display: flex; flex-direction: column; width: 1080px; height: 1920px;
    padding: 170px 160px 420px 90px; overflow: hidden; background: linear-gradient(160deg, #08bdf8 0%, #3062f9 50%, #8a3cf5 100%); }
  /* Rand rechts und unten frei lassen: dort liegen in Reels die Knöpfe und der Text von Instagram */
  .glow { position: absolute; left: -240px; top: -280px; width: 980px; height: 980px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.24) 0, rgba(255,255,255,0) 62%); animation: drift 15s linear both; }
  .ring { position: absolute; right: -280px; bottom: -300px; width: 860px; height: 860px; border-radius: 50%; background: rgba(255,255,255,.08);
    animation: grow 15s linear both; }
  .reel > .brand, .reel > .scene1, .reel > .foot { position: relative; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 50px; font-weight: 800; letter-spacing: -.02em; animation: fadeUp .7s .1s both; }
  .brand img { width: 84px; height: 84px; border-radius: 22px; }
  /* Szene 1: gleitet nach 6,6 s nach oben weg */
  .scene1 { display: flex; flex-direction: column; animation: fadeOut .6s 6.6s both; }
  .pill { align-self: flex-start; margin: 130px 0 36px; padding: 14px 30px; border-radius: 999px; background: rgba(255,255,255,.2);
    font-size: 30px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; animation: fadeUp .6s .5s both; }
  .hook { margin: 0; font-size: __HOOK_SIZE__px; line-height: 1.07; font-weight: 800; letter-spacing: -.03em; animation: fadeUp .8s .8s both; }
  .sub { margin: 40px 0 0; font-size: 46px; line-height: 1.35; font-weight: 500; color: rgba(255,255,255,.9); animation: fadeUp .7s 1.7s both; }
  /* Szene 2: liegt über dem Platz von Szene 1 */
  .scene2 { position: absolute; left: 90px; right: 160px; top: 600px; display: flex; flex-direction: column; gap: 60px; }
  .say { display: flex; align-items: center; gap: 28px; padding: 34px 40px; border: 2px solid rgba(255,255,255,.45); border-radius: 40px 40px 40px 12px;
    background: rgba(255,255,255,.16); font-size: 46px; font-weight: 700; line-height: 1.3; animation: fadeUp .7s 7.3s both; }
  /* Mikrofon wie in der App: blau, weißes Symbol, weißer Rand - pulsiert, solange man spricht */
  .mic { flex: none; width: 92px; height: 92px; display: grid; place-items: center; box-sizing: border-box; border: 4px solid rgba(255,255,255,.7);
    border-radius: 50%; background: #3062f9; animation: listen 1.1s 7.7s ease-in-out 3 both; }
  .mic svg { width: 44px; height: 44px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .push { display: flex; align-items: center; gap: 28px; padding: 34px 38px; border-radius: 40px; background: #fff; color: #0d1330;
    box-shadow: 0 44px 90px -30px rgba(15,10,70,.6); animation: slideIn .8s 9.6s cubic-bezier(.2,1.35,.4,1) both; }
  .push img { flex: none; width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 0 0 1px #ece8fb; }
  .push b { display: block; margin-bottom: 6px; font-size: 36px; }
  .push span { font-size: 36px; line-height: 1.3; color: #5d6480; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; font-size: 40px; font-weight: 700;
    animation: fadeUp .6s 12s both; }
  .foot .cta { padding: 22px 38px; border-radius: 24px; background: #fff; color: #5a32e6; font-weight: 800; animation: pop .6s 12.4s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: none; } }
  @keyframes fadeOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-60px); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(170px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.86); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes listen { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 50% { box-shadow: 0 0 0 22px rgba(255,255,255,0); } }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(240px, 300px); } }
  @keyframes grow { from { transform: scale(1); } to { transform: scale(1.14); } }
</style>
</head>
<body>
<div class="reel">
  <span class="glow"></span><span class="ring"></span>
  <div class="brand"><img src="__LOGO_PATH__" alt="">heylivo</div>
  <div class="scene1">
    <div class="pill">__CATEGORY__</div>
    <h1 class="hook">__HOOK__</h1>
    <p class="sub">__SUB__</p>
  </div>
  <div class="scene2">
    <div class="say"><span class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg></span><span>__VOICE__</span></div>
    <div class="push"><img src="__LOGO_PATH__" alt=""><div><b>Hey Livo</b><span>__PUSH__</span></div></div>
  </div>
  <div class="foot"><span>heylivo.com</span><span class="cta">__CTA__</span></div>
</div>
<script>
  // Aufnahme: alle Animationen anhalten und auf den Zeitpunkt t (Sekunden) stellen
  window.setTime = function (t) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
  };
</script>
</body>
</html>
